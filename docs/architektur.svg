<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1100" viewBox="0 0 680 550" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="550" fill="#FFFFFF"/>
  <text x="40" y="30" font-size="15" font-weight="bold" fill="#2C2C2A">A2A Order Network – Dienste und Kommunikation</text>

  <!-- client -->
  <rect x="60" y="60" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="140" y="83" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">client.py</text>
  <text x="140" y="101" font-size="10.5" fill="#5F5E5A" text-anchor="middle">schickt Kunden-E-Mail</text>
  <!-- registry -->
  <rect x="440" y="60" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="540" y="83" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Registry :8000</text>
  <text x="540" y="101" font-size="10.5" fill="#0F6E56" text-anchor="middle">Anmeldung, Heartbeat, Suche</text>
  <!-- orchestrator -->
  <rect x="230" y="170" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="193" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Orchestrator :8100</text>
  <text x="340" y="211" font-size="10.5" fill="#534AB7" text-anchor="middle">Root-Agent mit LLM + Ablauf-Guard</text>
  <!-- agents -->
  <rect x="40" y="290" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="130" y="313" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Intake :8101</text>
  <text x="130" y="331" font-size="10.5" fill="#534AB7" text-anchor="middle">E-Mail → JSON + CRM</text>
  <rect x="250" y="290" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="313" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Inventory :8102</text>
  <text x="340" y="331" font-size="10.5" fill="#534AB7" text-anchor="middle">Lager und Preise</text>
  <rect x="460" y="290" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="550" y="313" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Production :8103</text>
  <text x="550" y="331" font-size="10.5" fill="#534AB7" text-anchor="middle">Produktion, Liefertermine</text>
  <!-- mcp -->
  <rect x="250" y="400" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="423" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">MCP-Server :8200</text>
  <text x="340" y="441" font-size="10.5" fill="#0F6E56" text-anchor="middle">aus Aufgabe 1 (SQLite, Rabatt)</text>

  <!-- registry lookups (dashed) -->
  <line x1="222" y1="88" x2="436" y2="88" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M450 180 L540 180 L540 120" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- A2A / MCP calls (solid) -->
  <path d="M140 116 L140 198 L226 198" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M340 226 L340 258 L130 258 L130 286" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M340 258 L340 286" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M340 258 L550 258 L550 286" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="340" y1="346" x2="340" y2="396" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="350" y="375" font-size="10" fill="#5F5E5A">MCP (HTTP)</text>
  <text x="150" y="160" font-size="10" fill="#5F5E5A">A2A</text>
  <text x="400" y="252" font-size="10" fill="#5F5E5A">A2A</text>

  <!-- legend -->
  <line x1="60" y1="490" x2="96" y2="490" stroke="#444441" stroke-width="1.5"/>
  <text x="104" y="494" font-size="10.5" fill="#444441">A2A bzw. MCP (Aufgabe senden)</text>
  <line x1="330" y1="490" x2="366" y2="490" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="374" y="494" font-size="10.5" fill="#444441">Registry-Abfrage (wer kann was?)</text>
  <text x="60" y="520" font-size="10" fill="#888780">Alle Agents melden sich beim Start selbst bei der Registry an und senden alle 15 s einen Heartbeat.</text>
</svg>
