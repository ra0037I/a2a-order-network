[project]
name = "a2a-order-network"
version = "1.0.0"
description = "Industrial Computing HW2 (Option A): distributed A2A multi-agent system with dynamic registry lookup (order-to-quote)"
requires-python = ">=3.11"
dependencies = [
    "fasta2a[pydantic-ai],
    "pydantic-ai-slim[openai]>=1.0",
    "fastmcp>=3.4.4",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "litellm[proxy]>=1.105"
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
